spring.application.name=vivaeventos-payment-service
payment.gateway.provider=sandbox

spring.datasource.url=jdbc:h2:mem:payment_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.show-sql=false

services.order-service.url=http://localhost:8083

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${SPRING_RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

stripe.secret-key=sk_test_mock
stripe.webhook-secret=
stripe.success-url=http://localhost:3000/payment/success
stripe.cancel-url=http://localhost:3000/payment/cancel
