spring.application.name=vivaeventos-payment-service-test
payment.gateway.provider=sandbox
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

spring.datasource.url=jdbc:h2:mem:payment-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672

vivaeventos.messaging.exchange=vivaeventos.payments
vivaeventos.messaging.routing-key.approved=pago.aprobado
vivaeventos.messaging.routing-key.failed=pago.fallido

wompi.private-key=
wompi.public-key=
username: guest
password: guest

payment:
gateway:
provider: wompi

wompi:
base-url: https://sandbox.wompi.co/v1
private-key: prv_test_mock
public-key: pub_test_mock
redirect-url: https://vivaeventos.com/checkout/redirect
callback-url: https://vivaeventos.com/api/v1/payments/callback/wompi

services:
order-service:
url: http://localhost:9999

vivaeventos:
messaging:
exchange: payment.events
routing-key:
approved: payment.approved
failed: payment.failed

spring.jackson.serialization.write-enums-using-index=false

logging:
level:
co.edu.univalle.payment: DEBUG