spring.application.name=vivaeventos-payment-service-test

# Gateway - sandbox para tests
payment.gateway.provider=sandbox

# Base de datos H2 en memoria
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.datasource.url=jdbc:h2:mem:payment-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

# Mensajería
vivaeventos.messaging.exchange=vivaeventos.payments
vivaeventos.messaging.routing-key.approved=pago.aprobado
vivaeventos.messaging.routing-key.failed=pago.fallido

# Wompi (valores mock para tests)
wompi.base-url=http://localhost:9999
wompi.private-key=prv_test_mock
wompi.public-key=pub_test_mock
wompi.redirect-url=https://vivaeventos.com/checkout/redirect
wompi.callback-url=https://vivaeventos.com/api/v1/payments/callback/wompi

# Order service (sobreescrito por @DynamicPropertySource en los tests)
services.order-service.url=http://localhost:9998

# Jackson
spring.jackson.serialization.write-enums-using-index=false

# Logs
logging.level.co.edu.univalle.payment=DEBUG

spring.main.allow-circular-references=true
server.port=0
spring.rabbitmq.listener.simple.auto-startup=true